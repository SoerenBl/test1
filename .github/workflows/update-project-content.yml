name: Projektseiten aus content.txt aktualisieren

# Läuft bei jedem Push auf main, der mindestens eine content.txt
# berührt -- neu angelegt, bearbeitet oder gelöscht. Braucht keinerlei
# Secret/API-Key: die Übersetzung liefert die content.txt selbst
# (Deutsch und Englisch stehen schon drin), dieser Workflow baut daraus
# nur die HTML-Seite. Verarbeitet bei jedem Lauf alle content.txt im
# Repo, nicht nur die geänderten -- bei der überschaubaren Projektzahl
# hier kostet das nichts Nennenswertes, macht dafür den ganzen Ablauf
# robuster (keine Diff-Logik, die im Kantenfall danebenliegen könnte)
# und selbstheilend, falls eine Seite je von Hand aus dem Takt geraten
# sein sollte.
on:
  push:
    branches: [main]
    paths:
      - '**/content.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Alle Projektseiten aus ihrer content.txt neu erzeugen
        run: |
          find . -name content.txt -not -path './node_modules/*' -print0 \
            | xargs -0 -r node scripts/update-project-content.js

      - name: Ergebnis committen und pushen, falls sich etwas geändert hat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*/index.html'
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den generierten Seiten."
          else
            git commit -m "Projektseiten automatisch aus content.txt aktualisiert"
            git push
          fi
